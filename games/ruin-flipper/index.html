<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ruin Flipper — IdleRush</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Mulish:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0804;--bg2:#120f06;--surface:#1c1608;--surface2:#231b0a;
  --border:rgba(255,180,50,0.08);--border2:rgba(255,180,50,0.2);
  --text:#ede0c4;--muted:#8a7045;--dim:#5a4820;
  --gold:#ffc142;--amber:#ff9020;--green:#6dff90;--blue:#60c0ff;--red:#ff5555;
  --font-d:'Syne',sans-serif;--font-b:'Mulish',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 90% 50% at 50% 100%,rgba(255,193,66,0.04),transparent 70%);pointer-events:none;z-index:0}

header{position:relative;z-index:2;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(10,8,4,0.9);backdrop-filter:blur(12px);flex-shrink:0}
.logo{font-family:var(--font-d);font-size:20px;font-weight:800;letter-spacing:0.04em}
.logo span{color:var(--gold)}
.back{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:5px 10px;transition:color .15s}
.back:hover{color:var(--text)}
.money-display{font-family:var(--font-d);font-size:18px;color:var(--gold);letter-spacing:0.03em}

main{flex:1;display:grid;grid-template-columns:1fr 300px;overflow:hidden;position:relative;z-index:1}

/* NEIGHBORHOOD */
.neighborhood{display:flex;flex-direction:column;gap:0;overflow-y:auto;padding:16px;gap:12px}
.neighborhood::-webkit-scrollbar{width:3px}
.neighborhood::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}

.neigh-header{display:flex;justify-content:space-between;align-items:baseline}
.neigh-title{font-family:var(--font-d);font-size:18px;font-weight:800;letter-spacing:0.04em}
.market-ticker{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.market-trend{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:700}
.market-trend.up{background:rgba(109,255,144,0.12);color:var(--green)}
.market-trend.down{background:rgba(255,85,85,0.12);color:var(--red)}

/* PROPERTY GRID */
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

.prop-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s,transform .15s;cursor:pointer}
.prop-card:hover:not(.owned){border-color:var(--border2);transform:translateY(-2px)}
.prop-card.owned{border-color:rgba(109,255,144,0.2)}
.prop-card.renovating{border-color:rgba(255,193,66,0.3);animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 rgba(255,193,66,0)}to{box-shadow:0 0 12px rgba(255,193,66,0.2)}}

.prop-visual{height:90px;display:flex;align-items:center;justify-content:center;font-size:42px;background:var(--bg2);position:relative;overflow:hidden}
.decay-overlay{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 4px,rgba(80,40,0,0.15) 4px,rgba(80,40,0,0.15) 8px)}
.prop-card.owned .decay-overlay{display:none}

.reno-progress{position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--surface2)}
.reno-bar{height:100%;background:var(--gold);transition:width .3s}

.prop-info{padding:10px 12px 12px}
.prop-name{font-family:var(--font-d);font-size:14px;font-weight:800;letter-spacing:0.02em}
.prop-address{font-size:11px;color:var(--muted);margin-top:1px}
.prop-stats{display:flex;justify-content:space-between;margin-top:8px;font-size:12px}
.prop-price{color:var(--gold);font-weight:700}
.prop-income{color:var(--green)}
.prop-value{color:var(--blue)}
.prop-btn{width:100%;margin-top:10px;padding:8px;background:rgba(255,193,66,0.1);border:1px solid rgba(255,193,66,0.2);border-radius:7px;color:var(--gold);font-family:var(--font-d);font-size:13px;letter-spacing:0.05em;transition:all .15s}
.prop-btn:hover{background:rgba(255,193,66,0.18);border-color:rgba(255,193,66,0.35)}
.prop-btn:disabled{opacity:0.35;cursor:not-allowed}
.prop-btn.sell{background:rgba(109,255,144,0.08);border-color:rgba(109,255,144,0.2);color:var(--green)}
.prop-btn.sell:hover{background:rgba(109,255,144,0.15)}

/* PANEL */
.panel{border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.panel-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-section-title{font-family:var(--font-d);font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.panel-section-title::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);flex-shrink:0}

.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:12px;color:var(--muted)}
.stat-val{font-family:var(--font-d);font-size:14px;color:var(--text)}

.portfolio-list{flex:1;overflow-y:auto;padding:12px}
.portfolio-list::-webkit-scrollbar{width:3px}
.portfolio-list::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}
.portfolio-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.portfolio-item:last-child{border-bottom:none}
.port-icon{font-size:20px;flex-shrink:0}
.port-info{flex:1;min-width:0}
.port-name{font-size:12px;font-weight:700;color:var(--text)}
.port-income{font-size:11px;color:var(--green)}
.port-val{font-family:var(--font-d);font-size:13px;color:var(--gold);flex-shrink:0}

.prestige-wrap{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.prestige-btn{width:100%;padding:11px;background:linear-gradient(135deg,rgba(255,193,66,0.12),rgba(255,144,32,0.08));border:1px solid rgba(255,193,66,0.25);border-radius:10px;color:var(--gold);font-family:var(--font-d);font-size:15px;letter-spacing:0.06em;transition:all .15s}
.prestige-btn:hover:not(:disabled){background:linear-gradient(135deg,rgba(255,193,66,0.2),rgba(255,144,32,0.14));box-shadow:0 0 16px rgba(255,193,66,0.15)}
.prestige-btn:disabled{opacity:0.3;cursor:not-allowed}
.prestige-info{font-size:11px;color:var(--dim);text-align:center;margin-top:6px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--gold);color:var(--text);padding:9px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:100;animation:toastAnim 2.5s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes toastAnim{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}

@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:1fr 45vh}html,body{overflow:auto}.panel{border-left:none;border-top:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <a href="../../index.html" class="back">← IdleRush</a>
  <div class="logo">RUIN <span>FLIPPER</span></div>
  <div class="money-display">💰 $<span id="moneyDisplay">0</span></div>
</header>
<main>
  <div class="neighborhood">
    <div class="neigh-header">
      <div class="neigh-title" id="neighTitle">🏚️ Crumble Street</div>
      <div class="market-ticker">
        <span>Market:</span>
        <span class="market-trend up" id="marketTrend">↑ Hot</span>
        <span id="marketMult">×1.0</span>
      </div>
    </div>
    <div class="prop-grid" id="propGrid"></div>
  </div>

  <div class="panel">
    <div class="panel-section">
      <div class="panel-section-title">Portfolio Stats</div>
      <div class="stat-row"><span class="stat-label">Net Worth</span><span class="stat-val" id="netWorth">$0</span></div>
      <div class="stat-row"><span class="stat-label">Monthly Income</span><span class="stat-val" id="monthlyIncome">$0/s</span></div>
      <div class="stat-row"><span class="stat-label">Properties Owned</span><span class="stat-val" id="propsOwned">0</span></div>
      <div class="stat-row"><span class="stat-label">Total Flips</span><span class="stat-val" id="totalFlips">0</span></div>
      <div class="stat-row"><span class="stat-label">Prestige Level</span><span class="stat-val" id="prestigeLvl">0</span></div>
    </div>
    <div class="panel-section-title" style="padding:12px 16px 0">Your Properties</div>
    <div class="portfolio-list" id="portfolioList"></div>
    <div class="prestige-wrap">
      <button class="prestige-btn" id="prestigeBtn" disabled>🏆 SELL PORTFOLIO</button>
      <div class="prestige-info" id="prestigeInfo">Own 3 renovated properties to sell up</div>
    </div>
  </div>
</main>

<script>
const SAVE='ruinflipper_v1';

const NEIGHBORHOODS=[
  {name:'Crumble Street',emoji:'🏚️',mult:1,unlockCost:0},
  {name:'Dusty Ave',emoji:'🏘️',mult:1.5,unlockCost:50000},
  {name:'Midtown Block',emoji:'🏢',mult:2.5,unlockCost:500000},
  {name:'Uptown Heights',emoji:'🏙️',mult:5,unlockCost:5000000},
];

const PROP_TEMPLATES=[
  {id:'shack',name:'Broken Shack',emoji:'🏚️',buyCost:200,renoCost:150,renoTime:8,baseRent:5,baseValue:600},
  {id:'cottage',name:'Derelict Cottage',emoji:'🏠',buyCost:800,renoCost:500,renoTime:20,baseRent:18,baseValue:2400},
  {id:'townhouse',name:'Cracked Townhouse',emoji:'🏡',buyCost:3000,renoCost:2000,renoTime:45,baseRent:65,baseValue:9000},
  {id:'apartment',name:'Run-down Flat',emoji:'🏗️',buyCost:12000,renoCost:8000,renoTime:120,baseRent:250,baseValue:36000},
  {id:'office',name:'Abandoned Office',emoji:'🏢',buyCost:50000,renoCost:30000,renoTime:300,baseRent:900,baseValue:150000},
  {id:'mansion',name:'Haunted Mansion',emoji:'🏰',buyCost:200000,renoCost:120000,renoTime:600,baseRent:3500,baseValue:600000},
];

let state={
  money:500,totalEarned:0,prestige:0,neighIdx:0,
  properties:{},renoProgress:{},flips:0,
  mult:1,
};
let marketMult=1.0;
let marketDir=1;

function load(){try{const s=JSON.parse(localStorage.getItem(SAVE));if(s)state={...state,...s}}catch{}}
function save(){localStorage.setItem(SAVE,JSON.stringify(state))}

function fmt(n){
  if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';
  return'$'+Math.floor(n).toLocaleString();
}

function scaledCost(t,mult){return Math.floor(t*mult*(1+state.prestige*0.3)*state.mult)}
function scaledRent(t,mult){return t*mult*(1+state.prestige*0.5)*state.mult*marketMult}
function scaledValue(t,mult){return Math.floor(t*mult*(1+state.prestige*0.5)*state.mult*marketMult)}

function getNM(){return NEIGHBORHOODS[state.neighIdx]}

function renderGrid(){
  const grid=document.getElementById('propGrid');
  grid.innerHTML='';
  const nm=getNM();
  for(const t of PROP_TEMPLATES){
    const key=nm.name+t.id;
    const owned=state.properties[key];
    const reno=state.renoProgress[key];
    const buyCost=scaledCost(t.buyCost,nm.mult);
    const renoCost=scaledCost(t.renoCost,nm.mult);
    const rent=scaledRent(t.baseRent,nm.mult);
    const value=scaledValue(t.baseValue,nm.mult);

    const card=document.createElement('div');
    card.className='prop-card'+(owned==='renovated'?' owned':reno!==undefined?' renovating':'');

    let btnHtml='',statsHtml='';
    if(!owned&&reno===undefined){
      btnHtml=`<button class="prop-btn" ${state.money<buyCost?'disabled':''} data-action="buy" data-key="${key}" data-tid="${t.id}">Buy ${fmt(buyCost)}</button>`;
      statsHtml=`<div class="prop-stats"><span class="prop-price">Buy: ${fmt(buyCost)}</span><span class="prop-value">Est: ${fmt(value)}</span></div>`;
    }else if(reno!==undefined){
      const pct=Math.round(reno*100);
      btnHtml=`<button class="prop-btn" disabled>Renovating… ${pct}%</button>`;
      statsHtml=`<div class="prop-stats"><span class="prop-price">Reno: ${fmt(renoCost)}</span><span class="prop-income">+${fmt(rent)}/s</span></div>`;
    }else if(owned==='raw'){
      btnHtml=`<button class="prop-btn" ${state.money<renoCost?'disabled':''} data-action="reno" data-key="${key}" data-tid="${t.id}">Renovate ${fmt(renoCost)}</button>`;
      statsHtml=`<div class="prop-stats"><span class="prop-price">Reno: ${fmt(renoCost)}</span><span class="prop-income">+${fmt(rent)}/s after</span></div>`;
    }else{
      btnHtml=`<button class="prop-btn sell" data-action="sell" data-key="${key}" data-tid="${t.id}">Sell ${fmt(value)}</button>`;
      statsHtml=`<div class="prop-stats"><span class="prop-income">+${fmt(rent)}/s</span><span class="prop-value">Value: ${fmt(value)}</span></div>`;
    }

    const renoBar=reno!==undefined?`<div class="reno-progress"><div class="reno-bar" style="width:${(reno||0)*100}%"></div></div>`:'';

    card.innerHTML=`
      <div class="prop-visual">
        ${t.emoji}
        ${owned!=='renovated'?'<div class="decay-overlay"></div>':''}
        ${renoBar}
      </div>
      <div class="prop-info">
        <div class="prop-name">${t.name}</div>
        <div class="prop-address">${nm.name}</div>
        ${statsHtml}
        ${btnHtml}
      </div>`;

    card.querySelector('[data-action]')?.addEventListener('click',e=>{
      const el=e.currentTarget;
      const action=el.dataset.action,key=el.dataset.key,tid=el.dataset.tid;
      const tmpl=PROP_TEMPLATES.find(x=>x.id===tid);
      const nm2=getNM();
      if(action==='buy'){
        const cost=scaledCost(tmpl.buyCost,nm2.mult);
        if(state.money<cost)return;
        state.money-=cost;state.properties[key]='raw';
        toast('🏚️ Purchased '+tmpl.name);
      }else if(action==='reno'){
        const cost=scaledCost(tmpl.renoCost,nm2.mult);
        if(state.money<cost)return;
        state.money-=cost;state.renoProgress[key]=0;
        const totalTime=tmpl.renoTime*(1-state.prestige*0.05);
        startReno(key,totalTime,tmpl,nm2);
        toast('🔨 Renovating '+tmpl.name+'…');
      }else if(action==='sell'){
        const val=scaledValue(tmpl.baseValue,nm2.mult);
        state.money+=val;state.totalEarned+=val;
        delete state.properties[key];delete state.renoProgress[key];
        state.flips++;
        toast('💰 Sold '+tmpl.name+' for '+fmt(val)+'!');
      }
      updateUI();
    });
    grid.appendChild(card);
  }
}

const renoIntervals={};
function startReno(key,totalTime,tmpl,nm){
  if(renoIntervals[key])return;
  const steps=totalTime*10;
  let step=0;
  renoIntervals[key]=setInterval(()=>{
    step++;
    state.renoProgress[key]=step/steps;
    if(step>=steps){
      clearInterval(renoIntervals[key]);delete renoIntervals[key];
      state.properties[key]='renovated';delete state.renoProgress[key];
      toast('✅ '+tmpl.name+' renovation complete!');
      updateUI();
    }else{
      const card=document.querySelector(`[data-action="buy"][data-key="${key}"]`)?.closest('.prop-card')||document.querySelector(`[data-action="reno"][data-key="${key}"]`)?.closest('.prop-card');
      const bar=document.querySelector(`.prop-card .reno-bar`);
      renderGrid();
    }
  },100);
}

function getTotalRent(){
  let r=0;
  const nm=getNM();
  for(const [key,status] of Object.entries(state.properties)){
    if(status!=='renovated')continue;
    for(const t of PROP_TEMPLATES){
      if(key.endsWith(t.id)){r+=scaledRent(t.baseRent,nm.mult);break}
    }
  }
  return r;
}

function getOwnedCount(){return Object.values(state.properties).filter(v=>v==='renovated').length}

function updateUI(){
  document.getElementById('moneyDisplay').textContent=fmt(state.money).replace('$','');
  document.getElementById('neighTitle').textContent=getNM().emoji+' '+getNM().name;
  document.getElementById('netWorth').textContent=fmt(state.money);
  document.getElementById('monthlyIncome').textContent=fmt(getTotalRent())+'/s';
  document.getElementById('propsOwned').textContent=getOwnedCount();
  document.getElementById('totalFlips').textContent=state.flips;
  document.getElementById('prestigeLvl').textContent=state.prestige;

  const mm=marketMult;
  const trend=mm>=1?'up':'down';
  document.getElementById('marketTrend').className='market-trend '+trend;
  document.getElementById('marketTrend').textContent=mm>=1.2?'↑ Hot':mm>=1?'→ Stable':'↓ Cool';
  document.getElementById('marketMult').textContent='×'+mm.toFixed(1);

  const canPrestige=getOwnedCount()>=3;
  document.getElementById('prestigeBtn').disabled=!canPrestige;
  document.getElementById('prestigeInfo').textContent=canPrestige?'Sell your whole portfolio for a prestige bonus!':'Own 3 renovated properties to sell up';

  renderGrid();
  renderPortfolio();
  save();
}

function renderPortfolio(){
  const list=document.getElementById('portfolioList');
  list.innerHTML='';
  const nm=getNM();
  let any=false;
  for(const [key,status] of Object.entries(state.properties)){
    if(status!=='renovated')continue;any=true;
    for(const t of PROP_TEMPLATES){
      if(key.endsWith(t.id)){
        const div=document.createElement('div');div.className='portfolio-item';
        div.innerHTML=`<div class="port-icon">${t.emoji}</div><div class="port-info"><div class="port-name">${t.name}</div><div class="port-income">+${fmt(scaledRent(t.baseRent,nm.mult))}/s</div></div><div class="port-val">${fmt(scaledValue(t.baseValue,nm.mult))}</div>`;
        list.appendChild(div);break;
      }
    }
  }
  if(!any){list.innerHTML='<div style="font-size:12px;color:var(--dim);padding:12px;text-align:center">No renovated properties yet</div>'}
}

document.getElementById('prestigeBtn').addEventListener('click',()=>{
  const nm=getNM();
  let total=0;
  for(const [key,status] of Object.entries(state.properties)){
    if(status!=='renovated'){
      for(const t of PROP_TEMPLATES){
        if(key.endsWith(t.id)){total+=scaledValue(t.baseValue,nm.mult);break}
      }
    }
  }
  state.money+=total;state.totalEarned+=total;
  state.properties={};state.renoProgress={};
  state.prestige+=1;state.mult=1+state.prestige*0.3;
  toast('🏆 Portfolio sold! +'+fmt(total)+' bonus! Prestige '+state.prestige);
  updateUI();
});

// Market drift
setInterval(()=>{
  marketMult=Math.max(0.6,Math.min(2.0,marketMult+(Math.random()-.45)*0.1*marketDir));
  if(marketMult>=1.9||marketMult<=0.65)marketDir*=-1;
},3000);

// Income tick
let last=performance.now();
function tick(now){
  const dt=(now-last)/1000;last=now;
  const rent=getTotalRent();
  if(rent>0){state.money+=rent*dt;state.totalEarned+=rent*dt}
  document.getElementById('moneyDisplay').textContent=fmt(state.money).replace('$','');
  requestAnimationFrame(tick);
}

function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove())}

load();updateUI();requestAnimationFrame(tick);setInterval(save,10000);
</script>
</body>
</html>
