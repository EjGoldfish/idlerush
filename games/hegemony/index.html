<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hegemony — IdleRush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0c0b09;
  --bg2:       #111008;
  --bg3:       #161410;
  --surface:   #1c1a14;
  --surface2:  #242118;
  --border:    rgba(220,200,150,0.08);
  --border2:   rgba(220,200,150,0.18);
  --border3:   rgba(220,200,150,0.32);
  --text:      #e8e0cc;
  --muted:     #7a7060;
  --dim:       #4a4535;
  --cream:     #f0e8d0;
  --gold:      #c8a84a;
  --red:       #c03828;
  --blue:      #3868a8;
  --green:     #3a7848;
  --teal:      #2a7870;
  --orange:    #b85820;
  --font-d:    'Bebas Neue', sans-serif;
  --font-s:    'Libre Baskerville', serif;
  --font-m:    'IBM Plex Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-s);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
a    { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* Parchment grain */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 160px;
  opacity: 0.03;
  pointer-events: none; z-index: 0;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

/* ═══════════════════════════════
   MASTHEAD
═══════════════════════════════ */
.masthead {
  position: relative; z-index: 10;
  display: flex; align-items: stretch;
  background: var(--bg2);
  border-bottom: 2px solid var(--gold);
  flex-shrink: 0;
  min-height: 52px;
}
.masthead-brand {
  display: flex; align-items: center;
  padding: 0 20px;
  border-right: 1px solid var(--border2);
  gap: 12px; flex-shrink: 0;
}
.back-link {
  font-family: var(--font-m); font-size: 10px; color: var(--dim);
  border: 1px solid var(--border); border-radius: 3px;
  padding: 3px 8px; letter-spacing: 0.06em;
  transition: color .15s, border-color .15s;
}
.back-link:hover { color: var(--text); border-color: var(--border2); }
.brand-title {
  font-family: var(--font-d); font-size: 28px;
  letter-spacing: 0.12em; color: var(--cream);
  line-height: 1;
}
.brand-sub {
  font-family: var(--font-m); font-size: 9px;
  letter-spacing: 0.18em; color: var(--gold);
  text-transform: uppercase; margin-top: 1px;
}

/* STAT BAR */
.stat-bar {
  flex: 1; display: flex; align-items: stretch;
}
.stat-cell {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 6px 8px;
  border-right: 1px solid var(--border);
  position: relative; overflow: hidden;
  cursor: default;
  transition: background .15s;
}
.stat-cell:last-child { border-right: none; }
.stat-cell:hover { background: rgba(200,168,74,0.04); }

/* Animated fill bar at bottom of each stat */
.stat-cell::after {
  content: '';
  position: absolute; bottom: 0; left: 0;
  height: 2px;
  transition: width .8s ease;
  width: var(--pct, 0%);
}
.stat-cell[data-stat="economy"]::after   { background: var(--gold); }
.stat-cell[data-stat="military"]::after  { background: var(--red); }
.stat-cell[data-stat="diplomacy"]::after { background: var(--blue); }
.stat-cell[data-stat="culture"]::after   { background: var(--teal); }
.stat-cell[data-stat="technology"]::after{ background: var(--green); }

.stat-icon { font-size: 13px; line-height: 1; margin-bottom: 2px; }
.stat-name {
  font-family: var(--font-m); font-size: 8px;
  letter-spacing: 0.14em; color: var(--muted);
  text-transform: uppercase;
}
.stat-val {
  font-family: var(--font-d); font-size: 18px;
  line-height: 1.1; letter-spacing: 0.04em;
}
.stat-delta {
  font-family: var(--font-m); font-size: 8px;
  margin-top: 1px;
}
.stat-delta.up   { color: #5aa86a; }
.stat-delta.down { color: var(--red); }
.stat-delta.zero { color: var(--dim); }

/* Masthead right */
.masthead-right {
  display: flex; flex-direction: column;
  justify-content: center; align-items: flex-end;
  padding: 0 16px; flex-shrink: 0;
  border-left: 1px solid var(--border2);
  gap: 2px;
}
.era-display {
  font-family: var(--font-d); font-size: 16px;
  letter-spacing: 0.1em; color: var(--gold); line-height: 1;
}
.year-display {
  font-family: var(--font-m); font-size: 10px;
  color: var(--muted); letter-spacing: 0.06em;
}
.prestige-pips {
  display: flex; gap: 3px; margin-top: 2px;
}
.pip {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim);
}
.pip.lit { background: var(--gold); box-shadow: 0 0 5px var(--gold); }

/* ═══════════════════════════════
   LAYOUT — 3 columns
═══════════════════════════════ */
.layout {
  flex: 1; display: grid;
  grid-template-columns: 260px 1fr 270px;
  overflow: hidden; position: relative; z-index: 1;
}

/* ═══════════════════════════════
   LEFT — POLICIES
═══════════════════════════════ */
.col {
  display: flex; flex-direction: column;
  overflow: hidden; border-right: 1px solid var(--border);
}
.col:last-child { border-right: none; border-left: 1px solid var(--border); }

.col-header {
  padding: 10px 14px 9px;
  border-bottom: 1px solid var(--border2);
  flex-shrink: 0;
}
.col-title {
  font-family: var(--font-d); font-size: 15px;
  letter-spacing: 0.14em; color: var(--cream);
  display: flex; align-items: center; gap: 8px;
}
.col-title-line {
  flex: 1; height: 1px; background: var(--border2);
}
.col-sub {
  font-family: var(--font-m); font-size: 9px;
  color: var(--dim); letter-spacing: 0.1em;
  margin-top: 3px;
}

.col-scroll {
  flex: 1; overflow-y: auto; padding: 10px;
  display: flex; flex-direction: column; gap: 8px;
}
.col-scroll::-webkit-scrollbar { width: 3px; }

/* POLICY CARD */
.policy-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 11px 12px;
  position: relative; overflow: hidden;
  transition: border-color .15s;
}
.policy-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
}
.policy-card.enacted::before  { background: var(--gold); }
.policy-card.available::before{ background: var(--dim); }

.policy-card.available { cursor: pointer; }
.policy-card.available:hover {
  border-color: var(--border2);
  background: var(--surface2);
}
.policy-card.enacted {
  border-color: rgba(200,168,74,0.2);
  background: rgba(200,168,74,0.04);
}
.policy-card.locked { opacity: 0.3; cursor: not-allowed; }

.policy-header {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 5px;
}
.policy-name {
  font-family: var(--font-s); font-style: italic;
  font-size: 13px; font-weight: 700; color: var(--cream);
  line-height: 1.2;
}
.policy-era {
  font-family: var(--font-m); font-size: 8px;
  color: var(--dim); letter-spacing: 0.1em;
  flex-shrink: 0; margin-left: 6px;
  text-transform: uppercase;
}
.policy-desc {
  font-size: 11px; color: var(--muted);
  line-height: 1.5; margin-bottom: 7px;
}
.policy-effects {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-bottom: 7px;
}
.effect-tag {
  font-family: var(--font-m); font-size: 9px;
  padding: 2px 6px; border-radius: 2px;
  letter-spacing: 0.04em;
}
.eff-pos  { background: rgba(58,120,72,0.18);  color: #6ab87a; border: 1px solid rgba(58,120,72,0.25); }
.eff-neg  { background: rgba(192,56,40,0.15);  color: #d06858; border: 1px solid rgba(192,56,40,0.22); }
.eff-neu  { background: rgba(200,168,74,0.1);  color: var(--gold); border: 1px solid rgba(200,168,74,0.18); }

.policy-cost {
  font-family: var(--font-m); font-size: 9px;
  color: var(--dim); letter-spacing: 0.06em;
}
.policy-cost span { color: var(--gold); }

.policy-actions { display: flex; gap: 6px; margin-top: 8px; }
.p-btn {
  flex: 1; padding: 5px 8px;
  font-family: var(--font-m); font-size: 10px;
  letter-spacing: 0.08em; border-radius: 3px;
  transition: all .12s;
  border: 1px solid var(--border2);
}
.p-btn-enact {
  background: rgba(200,168,74,0.1); color: var(--gold);
  border-color: rgba(200,168,74,0.25);
}
.p-btn-enact:hover:not(:disabled) {
  background: rgba(200,168,74,0.2);
  border-color: var(--border3);
}
.p-btn-repeal {
  background: rgba(192,56,40,0.08); color: var(--red);
  border-color: rgba(192,56,40,0.2);
}
.p-btn-repeal:hover:not(:disabled) { background: rgba(192,56,40,0.15); }
.p-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Policy slots */
.slots-display {
  font-family: var(--font-m); font-size: 9px;
  color: var(--dim); letter-spacing: 0.08em;
  padding: 6px 10px; text-align: center;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.slots-display span { color: var(--gold); }

/* ═══════════════════════════════
   CENTER — MAP + EVENTS
═══════════════════════════════ */
.center-col {
  display: flex; flex-direction: column;
  overflow: hidden; background: var(--bg);
}
.center-tabs {
  display: flex; border-bottom: 1px solid var(--border2);
  flex-shrink: 0;
}
.c-tab {
  padding: 10px 18px;
  font-family: var(--font-d); font-size: 12px;
  letter-spacing: 0.14em; color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  cursor: pointer;
}
.c-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.c-tab:hover  { color: var(--text); }

.center-body {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.center-body::-webkit-scrollbar { width: 3px; }

/* MAP */
.map-wrap { position: relative; }
canvas#worldmap {
  width: 100%; border-radius: 4px;
  border: 1px solid var(--border2);
  display: block;
}
.map-legend {
  display: flex; gap: 12px; margin-top: 8px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--font-m); font-size: 9px;
  color: var(--muted); letter-spacing: 0.06em;
}
.legend-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}

/* RIVALS */
.rivals-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.rival-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px; padding: 10px 12px;
  transition: border-color .15s;
}
.rival-card:hover { border-color: var(--border2); }
.rival-card.at-war  { border-color: rgba(192,56,40,0.3); background: rgba(192,56,40,0.04); }
.rival-card.allied  { border-color: rgba(56,104,168,0.3); background: rgba(56,104,168,0.04); }
.rival-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.rival-name {
  font-family: var(--font-s); font-style: italic;
  font-size: 13px; font-weight: 700; color: var(--cream);
}
.rival-flag { font-size: 16px; }
.rival-relation {
  font-family: var(--font-m); font-size: 8px;
  letter-spacing: 0.1em; padding: 2px 6px;
  border-radius: 2px; text-transform: uppercase;
}
.rel-hostile  { background: rgba(192,56,40,0.15);  color: var(--red);  border: 1px solid rgba(192,56,40,0.2); }
.rel-neutral  { background: rgba(200,168,74,0.1);   color: var(--muted); border: 1px solid var(--border); }
.rel-friendly { background: rgba(56,104,168,0.15); color: #7aabe0; border: 1px solid rgba(56,104,168,0.2); }
.rel-allied   { background: rgba(56,104,168,0.25); color: #a0c8f0; border: 1px solid rgba(56,104,168,0.35); }
.rel-war      { background: rgba(192,56,40,0.25);  color: #e07060; border: 1px solid rgba(192,56,40,0.35); }

.rival-stats {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 3px; margin-bottom: 8px;
}
.rival-stat { text-align: center; }
.rival-stat-val {
  font-family: var(--font-m); font-size: 11px;
  color: var(--text); line-height: 1;
}
.rival-stat-key {
  font-size: 8px; color: var(--dim);
  text-transform: uppercase; letter-spacing: 0.06em;
  font-family: var(--font-m);
}

.rival-btns { display: flex; gap: 5px; }
.r-btn {
  flex: 1; padding: 4px 5px;
  font-family: var(--font-m); font-size: 9px;
  letter-spacing: 0.06em; border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--muted); background: var(--bg2);
  transition: all .12s; cursor: pointer;
}
.r-btn:hover:not(:disabled) { border-color: var(--border2); color: var(--text); }
.r-btn.danger:hover { border-color: rgba(192,56,40,0.4); color: var(--red); background: rgba(192,56,40,0.08); }
.r-btn.ally:hover   { border-color: rgba(56,104,168,0.4); color: #7aabe0;  background: rgba(56,104,168,0.08); }
.r-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* EVENTS */
.event-banner {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-left: 4px solid var(--gold);
  border-radius: 4px; padding: 14px 16px;
  animation: slideIn .25s ease;
}
@keyframes slideIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
.event-banner.crisis     { border-left-color: var(--red); }
.event-banner.opportunity{ border-left-color: var(--green); }
.event-banner.diplomatic { border-left-color: var(--blue); }

.event-kicker {
  font-family: var(--font-d); font-size: 10px;
  letter-spacing: 0.18em; color: var(--gold);
  margin-bottom: 5px; text-transform: uppercase;
}
.event-banner.crisis      .event-kicker { color: var(--red); }
.event-banner.opportunity .event-kicker { color: #6ab87a; }
.event-banner.diplomatic  .event-kicker { color: #7aabe0; }

.event-headline {
  font-family: var(--font-s); font-size: 15px;
  font-weight: 700; color: var(--cream);
  line-height: 1.3; margin-bottom: 6px;
}
.event-body {
  font-size: 12px; color: var(--muted);
  line-height: 1.6; margin-bottom: 12px;
  font-style: italic;
}
.event-choices { display: flex; flex-direction: column; gap: 6px; }
.e-choice {
  padding: 8px 12px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 3px;
  text-align: left; color: var(--text);
  font-size: 12px; line-height: 1.4;
  transition: all .12s; cursor: pointer;
}
.e-choice:hover {
  border-color: var(--border2);
  background: var(--surface);
  color: var(--cream);
}
.e-choice .choice-outcome {
  display: block; margin-top: 3px;
  font-family: var(--font-m); font-size: 10px;
  color: var(--dim);
}

/* VICTORY PATHS */
.victory-section { display: flex; flex-direction: column; gap: 8px; }
.victory-path {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px; padding: 10px 12px;
}
.vp-header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 5px;
}
.vp-name {
  font-family: var(--font-s); font-size: 13px;
  font-weight: 700; font-style: italic; color: var(--cream);
  display: flex; align-items: center; gap: 6px;
}
.vp-pct {
  font-family: var(--font-d); font-size: 16px; color: var(--gold);
}
.vp-bar { height: 5px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
.vp-fill { height: 100%; border-radius: 3px; transition: width .6s ease; }
.vp-desc {
  font-size: 10px; color: var(--dim); margin-top: 5px;
  font-family: var(--font-m); letter-spacing: 0.04em;
}

/* VICTORY MODAL */
.victory-modal {
  position: fixed; inset: 0;
  background: rgba(12,11,9,0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  backdrop-filter: blur(4px);
}
.victory-box {
  background: var(--bg2);
  border: 1px solid var(--gold);
  border-top: 4px solid var(--gold);
  padding: 40px 48px;
  max-width: 520px; width: 90%;
  text-align: center;
  animation: victoryIn .4s ease;
}
@keyframes victoryIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: scale(1); } }
.victory-type {
  font-family: var(--font-d); font-size: 13px;
  letter-spacing: 0.2em; color: var(--gold);
  margin-bottom: 10px;
}
.victory-title {
  font-family: var(--font-s); font-size: 28px;
  font-weight: 700; color: var(--cream);
  line-height: 1.2; margin-bottom: 12px;
}
.victory-desc {
  font-size: 13px; color: var(--muted);
  line-height: 1.7; font-style: italic;
  margin-bottom: 24px;
}
.victory-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 12px; margin-bottom: 24px;
}
.v-stat { text-align: center; }
.v-stat-val { font-family: var(--font-d); font-size: 22px; color: var(--gold); }
.v-stat-label { font-family: var(--font-m); font-size: 9px; color: var(--muted); letter-spacing: 0.1em; }
.v-btn {
  padding: 12px 28px;
  background: rgba(200,168,74,0.1);
  border: 1px solid rgba(200,168,74,0.35);
  color: var(--gold);
  font-family: var(--font-d); font-size: 15px;
  letter-spacing: 0.12em; border-radius: 3px;
  transition: all .15s; cursor: pointer;
}
.v-btn:hover { background: rgba(200,168,74,0.2); box-shadow: 0 0 20px rgba(200,168,74,0.15); }

/* ═══════════════════════════════
   RIGHT — INTEL / ADVISORS
═══════════════════════════════ */
.intel-tabs {
  display: flex; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.i-tab {
  flex: 1; padding: 8px 5px;
  font-family: var(--font-m); font-size: 8px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--dim); background: none;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s; cursor: pointer;
}
.i-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ADVISORS */
.advisor-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px; padding: 10px 11px;
  margin-bottom: 8px; position: relative;
}
.advisor-card.speaking {
  border-color: rgba(200,168,74,0.3);
  animation: advisorPulse 2s ease-in-out infinite;
}
@keyframes advisorPulse {
  0%,100% { box-shadow: 0 0 0 rgba(200,168,74,0); }
  50%     { box-shadow: 0 0 10px rgba(200,168,74,0.1); }
}
.advisor-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.advisor-avatar { font-size: 20px; flex-shrink: 0; }
.advisor-name {
  font-family: var(--font-s); font-size: 12px;
  font-weight: 700; font-style: italic; color: var(--cream);
}
.advisor-title {
  font-family: var(--font-m); font-size: 9px;
  color: var(--muted); letter-spacing: 0.06em;
}
.advisor-quote {
  font-size: 11px; color: var(--muted);
  line-height: 1.55; font-style: italic;
  border-left: 2px solid var(--border2);
  padding-left: 8px;
}

/* LEDGER */
.ledger-row {
  display: flex; justify-content: space-between;
  align-items: center; padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-m); font-size: 10px;
}
.ledger-row:last-child { border-bottom: none; }
.ledger-label { color: var(--muted); letter-spacing: 0.06em; }
.ledger-val   { color: var(--text); }
.ledger-val.pos { color: #6ab87a; }
.ledger-val.neg { color: var(--red); }
.ledger-section-header {
  font-family: var(--font-d); font-size: 11px;
  letter-spacing: 0.14em; color: var(--dim);
  padding: 8px 0 4px; text-transform: uppercase;
}

/* DISPATCH LOG */
.dispatch-entry {
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--muted);
  line-height: 1.5;
  animation: entryFade .2s ease;
}
@keyframes entryFade { from { opacity:0; } to { opacity:1; } }
.dispatch-entry:last-child { border-bottom: none; }
.dispatch-year {
  font-family: var(--font-m); font-size: 9px;
  color: var(--dim); margin-right: 6px;
}
.dispatch-entry.good { color: #6ab87a; }
.dispatch-entry.bad  { color: #d06858; }
.dispatch-entry.info { color: #7aabe0; }
.dispatch-entry.gold { color: var(--gold); }

/* TOAST */
.toast-container {
  position: fixed; bottom: 16px; left: 50%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 5px;
  z-index: 300; pointer-events: none;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border2);
  padding: 8px 16px; border-radius: 3px;
  font-family: var(--font-m); font-size: 11px;
  color: var(--text); white-space: nowrap;
  animation: toastAnim 2.8s ease forwards;
  border-left: 3px solid var(--gold);
}
.toast.good { border-left-color: var(--green); }
.toast.bad  { border-left-color: var(--red); }
.toast.info { border-left-color: var(--blue); }
@keyframes toastAnim {
  0%   { opacity:0; transform: translateY(6px); }
  12%  { opacity:1; transform: translateY(0); }
  75%  { opacity:1; }
  100% { opacity:0; transform: translateY(-4px); }
}

@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
  html, body { overflow: auto; }
  .col, .center-col { max-height: none; }
}

      if (!G.rivals || G.rivals.length === 0) initRivals();
    } else {
      initRivals();
    }
  } catch { initRivals(); }
}

function save() {
  G.lastSaved = Date.now();
  localStorage.setItem(SAVE, JSON.stringify(G));
}

/* ══════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════ */
function getEra() {
  for (let i = ERAS.length - 1; i >= 0; i--) {
    if (G.year >= ERAS[i].minYear) return ERAS[i];
  }
  return ERAS[0];
}
function getEraIdx() {
  for (let i = ERAS.length - 1; i >= 0; i--) {
    if (G.year >= ERAS[i].minYear) return i;
  }
  return 0;
}
function getPolicySlots() { return getEra().policySlots + (G.prestigeBonus.slots || 0); }
function fmt(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return Math.floor(n);
}

/* ══════════════════════════════════════════════════════
   RATES
══════════════════════════════════════════════════════ */
function getBaseRates() {
  const rates = { economy: 0.5, military: 0.3, diplomacy: 0.3, culture: 0.3, technology: 0.3 };

  // Active policy contributions
  for (const pid of G.policies) {
    const p = POLICIES.find(x => x.id === pid);
    if (!p) continue;
    for (const [k, v] of Object.entries(p.effects)) {
      rates[k] = (rates[k] || 0) + v;
    }
  }

  // Bonus rates from events/decisions
  for (const [k, v] of Object.entries(G.bonusRates || {})) {
    rates[k] = (rates[k] || 0) + v;
  }

  // Prestige bonuses
  for (const [k, v] of Object.entries(G.prestigeBonus || {})) {
    if (k !== 'slots') rates[k] = (rates[k] || 0) + v * 0.5;
  }

  // War penalty
  for (const r of G.rivals) {
    if (r.relation === 'war') {
      rates.economy   = (rates.economy   || 0) - 0.5;
      rates.diplomacy = (rates.diplomacy || 0) - 0.5;
      rates.military  = (rates.military  || 0) + 0.8;
    }
    if (r.relation === 'allied') {
      rates.diplomacy = (rates.diplomacy || 0) + 0.3;
      rates.military  = (rates.military  || 0) + 0.2;
    }
  }

  return rates;
}

/* ══════════════════════════════════════════════════════
   RIVAL AI
══════════════════════════════════════════════════════ */
function tickRivals(dt) {
  for (const r of G.rivals) {
    // Rivals grow based on persona
    const growthMap = {
      aggressive:  { military: 0.8, economy: 0.4, diplomacy: -0.1, culture: 0.2, technology: 0.3 },
      mercantile:  { military: 0.2, economy: 1.0, diplomacy: 0.5,  culture: 0.3, technology: 0.4 },
      cultural:    { military: 0.1, economy: 0.4, diplomacy: 0.4,  culture: 1.0, technology: 0.3 },
      diplomatic:  { military: 0.2, economy: 0.5, diplomacy: 1.0,  culture: 0.4, technology: 0.3 },
    };
    const growth = growthMap[r.persona] || growthMap.mercantile;
    for (const [k, v] of Object.entries(growth)) {
      r.stats[k] = (r.stats[k] || 0) + v * dt;
    }

    // Update relation score based on relative military + diplomacy
    const myPower = G.stats.military + G.stats.diplomacy;
    const theirPower = r.stats.military + r.stats.diplomacy;
    const delta = (myPower - theirPower) / 500;
    r.relationScore = Math.max(0, Math.min(100, (r.relationScore || 50) + delta * dt * 0.5 + (Math.random() - 0.5) * 0.1));

    // Relation thresholds
    if      (r.relation === 'war'      && r.relationScore > 55) r.relation = 'hostile';
    else if (r.relation === 'hostile'  && r.relationScore > 65) r.relation = 'neutral';
    else if (r.relation === 'neutral'  && r.relationScore > 75) r.relation = 'friendly';
    else if (r.relation === 'friendly' && r.relationScore > 85) r.relation = 'allied';
    else if (r.relation === 'allied'   && r.relationScore < 60) r.relation = 'friendly';
    else if (r.relation === 'neutral'  && r.relationScore < 35) r.relation = 'hostile';
    else if (r.relation === 'hostile'  && r.relationScore < 20 && r.stats.military > G.stats.military * 0.7) {
      r.relation = 'war';
      toast(`⚔️ ${r.name} has DECLARED WAR!`, 'bad');
      addLog(`${r.name} declared war on us!`, 'bad');
    }
  }
}

/* ══════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════ */
function enactPolicy(pid) {
  const p = POLICIES.find(x => x.id === pid);
  if (!p) return;
  if (G.policies.includes(pid)) return;
  if (G.policies.length >= getPolicySlots()) { toast('No policy slots available!', 'bad'); return; }

  // Check era
  const eraIdx = getEraIdx();
  if (p.era > eraIdx) { toast('Requires a later era', 'bad'); return; }

  // Check cost
  for (const [k, v] of Object.entries(p.cost || {})) {
    if ((G.stats[k] || 0) < v) { toast(`Need ${v} ${k} to enact`, 'bad'); return; }
  }
  for (const [k, v] of Object.entries(p.cost || {})) {
    G.stats[k] = Math.max(0, (G.stats[k] || 0) - v);
  }

  G.policies.push(pid);
  addLog(`Policy enacted: ${p.name}`, 'gold');
  toast(`✅ ${p.name} enacted`, 'good');
  renderAll();
}

function repealPolicy(pid) {
  const p = POLICIES.find(x => x.id === pid);
  if (!p) return;
  G.policies = G.policies.filter(x => x !== pid);
  // 50% cost refund
  for (const [k, v] of Object.entries(p.cost || {})) {
    G.stats[k] = (G.stats[k] || 0) + v * 0.5;
  }
  addLog(`Policy repealed: ${p.name}`, '');
  toast(`Policy repealed`, '');
  renderAll();
}

function rivalAction(rivalIdx, action) {
  const r = G.rivals[rivalIdx];
  if (!r) return;

  if (action === 'offer_trade') {
    const cost = 15;
    if (G.stats.economy < cost) { toast('Need 15 Economy', 'bad'); return; }
    G.stats.economy -= cost;
    r.relationScore = Math.min(100, r.relationScore + 15);
    r.stats.economy += 10;
    toast(`Trade offered to ${r.name}`, 'info');
    addLog(`Offered trade deal to ${r.name}`, 'info');
  } else if (action === 'cultural_exchange') {
    const cost = 15;
    if (G.stats.culture < cost) { toast('Need 15 Culture', 'bad'); return; }
    G.stats.culture -= cost;
    r.relationScore = Math.min(100, r.relationScore + 20);
    toast(`Cultural exchange with ${r.name}`, 'info');
    addLog(`Cultural exchange initiated with ${r.name}`, 'info');
  } else if (action === 'military_pressure') {
    if (G.stats.military < r.stats.military * 0.8) { toast('Insufficient military advantage', 'bad'); return; }
    r.relationScore = Math.max(0, r.relationScore - 25);
    G.stats.military -= 10;
    toast(`Military pressure applied on ${r.name}`, '');
    addLog(`Applied military pressure on ${r.name}`, '');
  } else if (action === 'declare_war') {
    if (r.relation === 'war') { toast('Already at war!', 'bad'); return; }
    r.relation = 'war'; r.relationScore = 10;
    addLog(`Declared war on ${r.name}!`, 'bad');
    toast(`⚔️ War declared on ${r.name}!`, 'bad');
  } else if (action === 'sue_for_peace') {
    if (r.relation !== 'war') return;
    const cost = 30;
    if (G.stats.diplomacy < cost) { toast('Need 30 Diplomacy', 'bad'); return; }
    G.stats.diplomacy -= cost;
    r.relation = 'neutral'; r.relationScore = 40;
    toast(`Peace agreed with ${r.name}`, 'good');
    addLog(`Peace treaty signed with ${r.name}`, 'good');
  }

  renderAll();
}

function resolveEvent(choice) {
  if (!G.currentEvent) return;
  choice.effect(G);
  addLog(`[EVENT] ${G.currentEvent.headline} — resolved`, 'info');
  G.currentEvent = null;
  G.eventCooldown = 60 + Math.random() * 120;
  renderAll();
}

function doPrestige() {
  if (!checkVictory()) return;

  // Store bonuses
  const topStat = Object.entries(G.stats).sort((a,b)=>b[1]-a[1])[0];
  G.prestigeBonus[topStat[0]] = (G.prestigeBonus[topStat[0]] || 0) + 2;
  G.prestigeBonus.slots = (G.prestigeBonus.slots || 0) + 1;
  G.prestige++;

  // Reset
  G.stats    = { economy: 15, military: 15, diplomacy: 15, culture: 15, technology: 15 };
  G.policies = [];
  G.year     = 1;
  G.victoryAchieved = null;
  G.bonusRates = {};
  G.currentEvent = null;
  G.eventCooldown = 30;
  G.log = [];
  initRivals();

  addLog(`Dynasty restart. Prestige ${G.prestige}. Legacy bonuses carried forward.`, 'gold');
  renderAll();
  // Remove modal
  document.getElementById('victoryModal')?.remove();
}

/* ══════════════════════════════════════════════════════
   VICTORY CHECK
══════════════════════════════════════════════════════ */
function checkVictory() {
  if (G.victoryAchieved) return true;
  for (const vp of VICTORY_PATHS) {
    if (G.stats[vp.stat] >= vp.threshold) {
      G.victoryAchieved = vp.id;
      showVictory(vp);
      return true;
    }
  }
  return false;
}

function showVictory(vp) {
  if (document.getElementById('victoryModal')) return;
  const modal = document.createElement('div');
  modal.className = 'victory-modal'; modal.id = 'victoryModal';
  const years = G.year;
  const policies = G.policies.length;
  modal.innerHTML = `
    <div class="victory-box">
      <div class="victory-type">VICTORY ACHIEVED — ${vp.icon} ${vp.id.toUpperCase()}</div>
      <div class="victory-title">${vp.name}</div>
      <div class="victory-desc">"${vp.desc}"<br><br>Your nation has achieved what few in history have dared to dream. The world bows to your supremacy.</div>
      <div class="victory-stats">
        <div class="v-stat"><div class="v-stat-val">${years}</div><div class="v-stat-label">Years Ruled</div></div>
        <div class="v-stat"><div class="v-stat-val">${G.prestige + 1}</div><div class="v-stat-label">Dynasty #</div></div>
        <div class="v-stat"><div class="v-stat-val">${Math.floor(G.stats[vp.stat])}</div><div class="v-stat-label">${vp.stat.toUpperCase()}</div></div>
      </div>
      <button class="v-btn" id="newDynastyBtn">BEGIN NEW DYNASTY →</button>

  document.body.appendChild(modal);

}

/* ══════════════════════════════════════════════════════
   WORLD MAP CANVAS
══════════════════════════════════════════════════════ */
let mapCanvas, mapCtx;
const NATION_REGIONS = [
  { cx: 0.22, cy: 0.42, rx: 0.16, ry: 0.12, label: 'YOU', self: true  },
  { cx: 0.60, cy: 0.30, rx: 0.14, ry: 0.11, label: 0,    self: false },
  { cx: 0.75, cy: 0.60, rx: 0.12, ry: 0.10, label: 1,    self: false },
  { cx: 0.42, cy: 0.72, rx: 0.13, ry: 0.09, label: 2,    self: false },
  { cx: 0.10, cy: 0.65, rx: 0.10, ry: 0.10, label: 3,    self: false },
];

function drawMap() {
  if (!mapCanvas) {
    mapCanvas = document.getElementById('worldmap');
    if (!mapCanvas) return;
  }
  mapCtx = mapCanvas.getContext('2d');
  const W = mapCanvas.width, H = mapCanvas.height;
  mapCtx.clearRect(0, 0, W, H);

  // Ocean bg
  const ocean = mapCtx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.6);
  ocean.addColorStop(0,   'rgba(20,28,42,1)');
  ocean.addColorStop(1,   'rgba(10,14,20,1)');
  mapCtx.fillStyle = ocean;
  mapCtx.fillRect(0, 0, W, H);

  // Grid
  mapCtx.strokeStyle = 'rgba(200,200,150,0.04)';
  mapCtx.lineWidth = 1;
  for (let x = 0; x < W; x += W/12) {
    mapCtx.beginPath(); mapCtx.moveTo(x,0); mapCtx.lineTo(x,H); mapCtx.stroke();
  }
  for (let y = 0; y < H; y += H/8) {
    mapCtx.beginPath(); mapCtx.moveTo(0,y); mapCtx.lineTo(W,y); mapCtx.stroke();
  }

  // Draw each nation region
  NATION_REGIONS.forEach((reg, i) => {
    const cx = reg.cx * W, cy = reg.cy * H;
    const rx = reg.rx * W, ry = reg.ry * H;

    let color, relation = 'self';
    if (reg.self) {
      color = '#c8a84a';
    } else {
      const rival = G.rivals[reg.label];
      if (!rival) return;
      const relColors = { war: '#c03828', hostile: '#a04030', neutral: '#607060', friendly: '#3868a8', allied: '#2858a0' };
      color = relColors[rival.relation] || '#607060';
      relation = rival.relation;
    }

    // Territory blob
    mapCtx.save();
    mapCtx.beginPath();
    // Slightly irregular blob using bezier
    mapCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    const grad = mapCtx.createRadialGradient(cx-rx*0.2, cy-ry*0.2, 0, cx, cy, rx);
    grad.addColorStop(0, color + '40');
    grad.addColorStop(0.6, color + '20');
    grad.addColorStop(1, color + '08');
    mapCtx.fillStyle = grad;
    mapCtx.fill();
    mapCtx.strokeStyle = color + '50';
    mapCtx.lineWidth = 1.5;
    mapCtx.stroke();
    mapCtx.restore();

    // Capital dot
    mapCtx.beginPath();
    mapCtx.arc(cx, cy, 4, 0, Math.PI*2);
    mapCtx.fillStyle = color;
    mapCtx.fill();
    mapCtx.beginPath();
    mapCtx.arc(cx, cy, 7, 0, Math.PI*2);
    mapCtx.strokeStyle = color + '60';
    mapCtx.lineWidth = 1;
    mapCtx.stroke();

    // Label
    mapCtx.font = 'bold 9px "IBM Plex Mono"';
    mapCtx.fillStyle = color + 'cc';
    mapCtx.textAlign = 'center';
    const label = reg.self ? 'YOU' : (G.rivals[reg.label]?.name?.split(' ')[1] || '');
    mapCtx.fillText(label, cx, cy - ry - 5);

    // War X
    if (!reg.self && G.rivals[reg.label]?.relation === 'war') {
      mapCtx.font = '14px serif';
      mapCtx.fillStyle = '#e04030cc';
      mapCtx.fillText('✕', cx + rx * 0.5, cy - ry * 0.3);
    }
    // Allied star
    if (!reg.self && G.rivals[reg.label]?.relation === 'allied') {
      mapCtx.font = '12px serif';
      mapCtx.fillStyle = '#4090e0cc';
      mapCtx.fillText('★', cx + rx * 0.5, cy - ry * 0.3);
    }
  });

  // Power bar at bottom
  const statOrder = ['economy','military','diplomacy','culture','technology'];
  const statColors = { economy:'#c8a84a', military:'#c03828', diplomacy:'#3868a8', culture:'#2a7870', technology:'#3a7848' };
  const barH = 8, barY = H - barH - 6, totalW = W - 20, startX = 10;
  const total = statOrder.reduce((s,k) => s + (G.stats[k]||0), 0) || 1;
  let bx = startX;
  for (const k of statOrder) {
    const w = (G.stats[k] / total) * totalW;
    mapCtx.fillStyle = statColors[k] + 'aa';
    mapCtx.fillRect(bx, barY, w, barH);
    bx += w;
  }
  mapCtx.strokeStyle = 'rgba(200,180,120,0.15)';
  mapCtx.lineWidth = 1;
  mapCtx.strokeRect(startX, barY, totalW, barH);
}

/* ══════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════ */
function renderTopbar() {
  const STAT_KEYS = ['economy','military','diplomacy','culture','technology'];
  const rates = getBaseRates();
  for (const k of STAT_KEYS) {
    const val = G.stats[k] || 0;
    const rate = rates[k] || 0;
    const max = 300;
    document.getElementById(`sv-${k}`).textContent = fmt(val);
    const deltaEl = document.getElementById(`sd-${k}`);
    deltaEl.textContent = (rate >= 0 ? '+' : '') + rate.toFixed(1) + '/yr';
    deltaEl.className = 'stat-delta ' + (rate > 0 ? 'up' : rate < 0 ? 'down' : 'zero');
    const cell = document.querySelector(`[data-stat="${k}"]`);
    if (cell) cell.style.setProperty('--pct', Math.min(100, (val/max)*100) + '%');
  }

  const era = getEra();
  document.getElementById('eraDisplay').textContent = era.name;
  document.getElementById('yearDisplay').textContent = `YEAR ${Math.floor(G.year)}`;

  // Prestige pips
  const pips = document.getElementById('prestigePips');
  pips.innerHTML = '';
  for (let i = 0; i < Math.min(10, Math.max(3, G.prestige + 3)); i++) {
    const d = document.createElement('div');
    d.className = 'pip' + (i < G.prestige ? ' lit' : '');
    pips.appendChild(d);
  }
}

function renderPolicies() {
  const list = document.getElementById('policyList');
  const eraIdx = getEraIdx();
  const slots = getPolicySlots();
  const used = G.policies.length;

  document.getElementById('slotsUsed').textContent = used;
  document.getElementById('slotsMax').textContent  = slots;

  list.innerHTML = '';

  // Sort: active first, then by era
  const sorted = [...POLICIES].sort((a, b) => {
    const aActive = G.policies.includes(a.id) ? 0 : 1;
    const bActive = G.policies.includes(b.id) ? 0 : 1;
    if (aActive !== bActive) return aActive - bActive;
    return a.era - b.era;
  });

  for (const p of sorted) {
    const active  = G.policies.includes(p.id);
    const locked  = p.era > eraIdx;
    const full    = !active && used >= slots;
    const canAfford = Object.entries(p.cost||{}).every(([k,v]) => (G.stats[k]||0) >= v);
    const costStr = Object.entries(p.cost||{}).map(([k,v])=>`<span>${v}</span> ${k}`).join(', ');

    const div = document.createElement('div');
    div.className = 'policy-card ' + (active ? 'enacted' : locked ? 'locked' : 'available');
    div.innerHTML = `
      <div class="policy-header">
        <div class="policy-name">${p.name}</div>
        <div class="policy-era">${ERAS[p.era]?.name.split(' ')[0]}</div>
      </div>
      <div class="policy-desc">${p.desc}</div>
      <div class="policy-effects">${p.tags.map(t => {
        const cls = t.startsWith('+') ? 'eff-pos' : t.startsWith('-') ? 'eff-neg' : 'eff-neu';
        return `<span class="effect-tag ${cls}">${t}</span>`;
      }).join('')}</div>
      ${locked ? `<div class="policy-cost">Requires <span>${ERAS[p.era]?.name}</span></div>` :
        Object.keys(p.cost||{}).length > 0 ? `<div class="policy-cost">Cost: ${costStr}</div>` : ''}
      ${!locked ? `<div class="policy-actions">
        ${active
          ? `<button class="p-btn p-btn-repeal" data-repeal="${p.id}">REPEAL</button>`
          : `<button class="p-btn p-btn-enact" data-enact="${p.id}" ${full || !canAfford ? 'disabled' : ''}>${full ? 'SLOTS FULL' : !canAfford ? 'UNAFFORDABLE' : 'ENACT'}</button>`
        }
      </div>` : ''}`;

    list.appendChild(div);
  }

  list.querySelectorAll('[data-enact]').forEach(b => b.addEventListener('click', () => enactPolicy(b.dataset.enact)));
  list.querySelectorAll('[data-repeal]').forEach(b => b.addEventListener('click', () => repealPolicy(b.dataset.repeal)));
}

    const grid = document.createElement('div'); grid.className = 'rivals-grid';
    G.rivals.forEach((r, i) => {
      const relClass = r.relation === 'war' ? 'at-war' : r.relation === 'allied' ? 'allied' : '';
      const relLabel = r.relation.charAt(0).toUpperCase() + r.relation.slice(1);
      const relCls   = `rel-${r.relation}`;
      const div = document.createElement('div');
      div.className = `rival-card ${relClass}`;
      div.innerHTML = `
        <div class="rival-header">
          <div>
            <div class="rival-name">${r.name}</div>
            <div style="font-family:var(--font-m);font-size:9px;color:var(--dim);text-transform:uppercase;margin-top:2px;letter-spacing:0.08em">${r.persona}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
            <div class="rival-flag">${r.flag}</div>
            <div class="rival-relation ${relCls}">${relLabel}</div>
          </div>
        </div>
        <div class="rival-stats">
          ${['economy','military','diplomacy','culture','technology'].map(k=>`
            <div class="rival-stat">
              <div class="rival-stat-val">${fmt(r.stats[k]||0)}</div>
              <div class="rival-stat-key">${k.slice(0,3)}</div>
            </div>`).join('')}
        </div>
        <div class="rival-btns">
          <button class="r-btn ally"   data-ai="${i}" data-act="offer_trade"        title="Offer trade deal">Trade</button>
          <button class="r-btn ally"   data-ai="${i}" data-act="cultural_exchange"  title="Cultural exchange">Culture</button>
          <button class="r-btn danger" data-ai="${i}" data-act="military_pressure"  title="Apply military pressure">Pressure</button>
          ${r.relation === 'war'
            ? `<button class="r-btn ally" data-ai="${i}" data-act="sue_for_peace">Peace</button>`
            : `<button class="r-btn danger" data-ai="${i}" data-act="declare_war">War</button>`}
        </div>`;
      grid.appendChild(div);
    });
    body.appendChild(grid);
    body.querySelectorAll('[data-ai]').forEach(b =>
      b.addEventListener('click', () => rivalAction(parseInt(b.dataset.ai), b.dataset.act))
    );

  } else if (activeTab === 'events') {
    if (G.currentEvent) {
      const ev = G.currentEvent;
      const div = document.createElement('div');
      div.className = `event-banner ${ev.type}`;
      div.innerHTML = `
        <div class="event-kicker">🔔 ${ev.type.toUpperCase()} — DISPATCH RECEIVED</div>
        <div class="event-headline">${ev.headline}</div>
        <div class="event-body">${ev.body}</div>
        <div class="event-choices">${ev.choices.map((c,idx)=>`
          <button class="e-choice" data-ci="${idx}">
            ${c.text}
            <span class="choice-outcome">${c.outcome}</span>
          </button>`).join('')}
        </div>`;
      body.appendChild(div);
      body.querySelectorAll('[data-ci]').forEach(b =>
        b.addEventListener('click', () => resolveEvent(ev.choices[parseInt(b.dataset.ci)]))
      );
    } else {
      body.innerHTML = `<div style="text-align:center;padding:50px 20px;color:var(--dim)">
        <div style="font-size:28px;margin-bottom:14px">📜</div>
        <div style="font-family:var(--font-d);font-size:14px;letter-spacing:0.12em;margin-bottom:8px">NO PENDING DISPATCHES</div>
        <div style="font-size:12px;font-style:italic;color:var(--dim)">Events arise as your civilization grows. Stay prepared.</div>
      </div>`;
    }

  } else if (activeTab === 'victory') {
    const div = document.createElement('div');
    div.innerHTML = `<div style="font-family:var(--font-s);font-size:13px;font-style:italic;color:var(--muted);margin-bottom:12px">Five paths lead to supremacy. Only one need be completed.</div>`;
    body.appendChild(div);
    const vpDiv = document.createElement('div'); vpDiv.className = 'victory-section';
    for (const vp of VICTORY_PATHS) {
      const val = G.stats[vp.stat] || 0;
      const pct = Math.min(100, (val / vp.threshold) * 100);
      const el = document.createElement('div');
      el.className = 'victory-path';
      el.style.borderLeftColor = pct >= 100 ? vp.color : '';
      el.innerHTML = `
        <div class="vp-header">
          <div class="vp-name">${vp.icon} ${vp.name} ${pct >= 100 ? '<span style="color:#6ab87a;font-size:10px;font-family:var(--font-m)">★ ACHIEVED</span>' : ''}</div>
          <div class="vp-pct" style="color:${vp.color}">${Math.floor(pct)}%</div>
        </div>
        <div class="vp-bar"><div class="vp-fill" style="width:${pct}%;background:${vp.color}"></div></div>
        <div class="vp-desc">${vp.desc}<br>Current ${vp.stat}: <strong style="color:${vp.color}">${fmt(val)}</strong> / ${vp.threshold}</div>`;
      vpDiv.appendChild(el);
    }
    body.appendChild(vpDiv);
  }
}

function renderRight() {
  const el = document.getElementById('rightContent');
  el.innerHTML = '';

  if (activeITab === 'advisors') {
    // Find most relevant advisor (highest rate contributor)
    const rates = getBaseRates();
    const topStat = Object.entries(rates).sort((a,b)=>b[1]-a[1])[0]?.[0];

    for (const adv of ADVISORS) {
      const speaking = adv.stat === topStat;
      const quote = adv.quotes[Math.floor(G.year / 30) % adv.quotes.length];
      const div = document.createElement('div');
      div.className = 'advisor-card' + (speaking ? ' speaking' : '');
      div.innerHTML = `
        <div class="advisor-header">
          <div class="advisor-avatar">${adv.avatar}</div>
          <div>
            <div class="advisor-name">${adv.name}</div>
            <div class="advisor-title">${adv.title}</div>
          </div>
        </div>
        <div class="advisor-quote">"${quote}"</div>`;
      el.appendChild(div);
    }

  } else if (activeITab === 'ledger') {
    const rates = getBaseRates();
    const sections = [
      { label: 'CURRENT RATES (PER YEAR)', rows: [
        ['Economy',    rates.economy?.toFixed(1) || '0', rates.economy >= 0 ? 'pos' : 'neg'],
        ['Military',   rates.military?.toFixed(1) || '0', rates.military >= 0 ? 'pos' : 'neg'],
        ['Diplomacy',  rates.diplomacy?.toFixed(1) || '0', rates.diplomacy >= 0 ? 'pos' : 'neg'],
        ['Culture',    rates.culture?.toFixed(1) || '0', rates.culture >= 0 ? 'pos' : 'neg'],
        ['Technology', rates.technology?.toFixed(1) || '0', rates.technology >= 0 ? 'pos' : 'neg'],
      ]},
      { label: 'STANDING', rows: [
        ['Active Policies',  G.policies.length + ' / ' + getPolicySlots(), ''],
        ['Rivals at War',    G.rivals.filter(r=>r.relation==='war').length, G.rivals.some(r=>r.relation==='war') ? 'neg' : ''],
        ['Allies',           G.rivals.filter(r=>r.relation==='allied').length, G.rivals.some(r=>r.relation==='allied') ? 'pos' : ''],
        ['Dynasty #',        G.prestige + 1, ''],
        ['Current Era',      getEra().name, ''],
      ]},
    ];
    for (const sec of sections) {
      el.innerHTML += `<div class="ledger-section-header">${sec.label}</div>`;
      for (const [label, val, cls] of sec.rows) {
        el.innerHTML += `<div class="ledger-row"><span class="ledger-label">${label}</span><span class="ledger-val ${cls}">${val}</span></div>`;
      }
    }

  } else if (activeITab === 'dispatch') {
    if (G.log.length === 0) {
      el.innerHTML = `<div style="color:var(--dim);font-family:var(--font-m);font-size:10px;padding:20px;text-align:center;letter-spacing:0.08em">NO RECORDS YET</div>`;
    } else {
      [...G.log].reverse().slice(0, 50).forEach(entry => {
        const d = document.createElement('div');
        d.className = `dispatch-entry ${entry.type || ''}`;
        d.innerHTML = `<span class="dispatch-year">Yr ${Math.floor(entry.year)}</span>${entry.text}`;
        el.appendChild(d);
      });
    }
  }
}

function renderAll() {
  renderTopbar();
  renderPolicies();
  renderCenter();
  renderRight();
}

/* ══════════════════════════════════════════════════════
   TOAST / LOG
══════════════════════════════════════════════════════ */
function toast(msg, type = '') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function addLog(text, type = '') {
  G.log.push({ text, type, year: G.year });
  if (G.log.length > 300) G.log.shift();
}

/* ══════════════════════════════════════════════════════
   EVENT TRIGGER
══════════════════════════════════════════════════════ */
function tryTriggerEvent() {
  if (G.currentEvent || G.eventCooldown > 0) return;
  const total = Object.values(G.stats).reduce((a,b)=>a+b,0);
  if (total < 80) return;
  if (Math.random() > 0.004) return;

  const eligible = EVENTS.filter(e => {
    if (G.recentEvents?.includes(e.id)) return false;
    return true;
  });
  if (!eligible.length) return;

  G.currentEvent = eligible[Math.floor(Math.random() * eligible.length)];
  G.recentEvents = [...(G.recentEvents||[]).slice(-3), G.currentEvent.id];
  G.eventCooldown = 90;
  toast(`📜 New dispatch: ${G.currentEvent.headline}`, 'info');
  addLog(`[DISPATCH] ${G.currentEvent.headline}`, 'info');
  if (activeTab === 'events') renderCenter();
}

/* ══════════════════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════════════════ */
function tick(now) {
  const dt = Math.min((now - lastTick) / 1000, 0.5);
  lastTick = now;

  // Year progresses (1 year per ~10 seconds)
  G.year += dt * 0.1;

  // Stat production
  const rates = getBaseRates();
  for (const [k, v] of Object.entries(rates)) {
    G.stats[k] = Math.max(0, (G.stats[k] || 0) + v * dt * 0.1);
    if (v > 0) G.totalStats[k] = (G.totalStats[k] || 0) + v * dt * 0.1;
  }

  // Rival AI
  tickRivals(dt * 0.05);

  // Timers
  if (G.eventCooldown > 0) G.eventCooldown = Math.max(0, G.eventCooldown - dt);

  // Events
  tryTriggerEvent();

  // Victory check
  if (!G.victoryAchieved) checkVictory();

  // Throttled UI render
  renderTimer += dt;
  if (renderTimer >= 0.5) { // every 500ms
    renderTimer = 0;
    renderTopbar();
    if (activeTab === 'worldmap') { renderCenter(); }
    else if (activeTab === 'victory') renderCenter();
    if (activeITab === 'ledger') renderRight();
  }

  // Auto-save
  if (Date.now() - lastSave > 15000) { save(); lastSave = Date.now(); }

  requestAnimationFrame(tick);
}

/* ══════════════════════════════════════════════════════
   TAB EVENTS
══════════════════════════════════════════════════════ */
document.querySelectorAll('.c-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.c-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;
    renderCenter();
  });
});
document.querySelectorAll('.i-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.i-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeITab = t.dataset.itab;
    renderRight();
  });
});

/* ══════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════ */
load();
if (G.log.length === 0) {
  addLog('The Republic has been founded. The world watches.', 'gold');
  addLog('Enact policies from the council to begin growing.', '');
  addLog('Monitor rival nations — some will grow faster than you.', 'info');
}
renderAll();
requestAnimationFrame(tick);
</script>
</body>
</html>
