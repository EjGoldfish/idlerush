<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Primordial Soup — IdleRush</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Mulish:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030a0a;--bg2:#061212;--surface:#0a1f1f;--surface2:#0d2626;
  --border:rgba(0,255,180,0.08);--border2:rgba(0,255,180,0.18);
  --text:#d4ede8;--muted:#4a8878;--dim:#2a5545;
  --green:#00ffb4;--teal:#00d4aa;--amber:#ffb830;--pink:#ff6b9d;--blue:#4db8ff;
  --font-d:'Syne',sans-serif;--font-b:'Mulish',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* BG */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(0,255,180,0.04),transparent 70%);pointer-events:none;z-index:0}

/* HEADER */
header{position:relative;z-index:2;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(3,10,10,0.9);backdrop-filter:blur(12px);flex-shrink:0}
.logo{font-family:var(--font-d);font-size:20px;font-weight:800;letter-spacing:0.04em}
.logo span{color:var(--green)}
.back{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:5px 10px;transition:color .15s}
.back:hover{color:var(--text)}
.era-badge{font-family:var(--font-d);font-size:12px;letter-spacing:0.1em;color:var(--amber);background:rgba(255,184,48,0.1);border:1px solid rgba(255,184,48,0.2);padding:4px 12px;border-radius:6px}

/* MAIN LAYOUT */
main{flex:1;display:grid;grid-template-columns:1fr 280px;overflow:hidden;position:relative;z-index:1}

/* SOUP CANVAS AREA */
.soup-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;overflow:hidden;position:relative}

canvas#soup{border-radius:50%;border:2px solid var(--border2);box-shadow:0 0 60px rgba(0,255,180,0.1),0 0 120px rgba(0,255,180,0.04);cursor:pointer;transition:box-shadow .2s}
canvas#soup:active{box-shadow:0 0 80px rgba(0,255,180,0.25)}

.resource-row{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.resource{text-align:center}
.resource-val{font-family:var(--font-d);font-size:22px;color:var(--green);letter-spacing:0.02em;line-height:1}
.resource-label{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.08em}

.evolution-bar-wrap{width:100%;max-width:380px}
.evo-header{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.evo-bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.evo-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:4px;transition:width .3s ease}

.era-title{font-family:var(--font-d);font-size:28px;font-weight:800;color:var(--text);letter-spacing:0.03em;text-align:center}
.era-sub{font-size:13px;color:var(--muted);text-align:center;margin-top:-8px}

.float-particle{position:absolute;pointer-events:none;font-size:18px;animation:floatUp .9s ease-out forwards;z-index:10}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(0.5)}}

/* PANEL */
.panel{border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.panel-tabs{display:flex;border-bottom:1px solid var(--border)}
.panel-tab{flex:1;padding:12px 8px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:0.06em;transition:color .15s,border-color .15s}
.panel-tab.active{color:var(--green);border-bottom-color:var(--green)}
.panel-content{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel-content::-webkit-scrollbar{width:3px}
.panel-content::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}

/* UPGRADE CARD */
.upg-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,background .15s}
.upg-card:not(.locked):not(.maxed):hover{border-color:var(--border2);background:rgba(0,255,180,0.04);cursor:pointer}
.upg-card.locked{opacity:0.4;cursor:not-allowed}
.upg-card.maxed{border-color:rgba(0,255,180,0.2);background:rgba(0,255,180,0.04)}
.upg-icon{font-size:28px;flex-shrink:0;width:36px;text-align:center}
.upg-info{flex:1;min-width:0}
.upg-name{font-weight:700;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px}
.upg-lvl{font-size:11px;color:var(--green);background:rgba(0,255,180,0.1);padding:1px 5px;border-radius:3px}
.upg-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.upg-cost{font-family:var(--font-d);font-size:13px;color:var(--amber);flex-shrink:0;white-space:nowrap}

/* EVOLUTION PATHS */
.path-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
.path-card:hover{border-color:var(--border2);background:rgba(0,255,180,0.04)}
.path-card.selected{border-color:var(--green);background:rgba(0,255,180,0.06)}
.path-name{font-family:var(--font-d);font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.path-desc{font-size:12px;color:var(--muted);line-height:1.5}
.path-bonus{font-size:11px;color:var(--green);margin-top:6px}

/* PRESTIGE */
.prestige-wrap{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.prestige-btn{width:100%;padding:11px;background:linear-gradient(135deg,rgba(0,255,180,0.12),rgba(0,212,170,0.08));border:1px solid rgba(0,255,180,0.25);border-radius:10px;color:var(--green);font-family:var(--font-d);font-size:16px;letter-spacing:0.06em;transition:all .15s}
.prestige-btn:hover:not(:disabled){background:linear-gradient(135deg,rgba(0,255,180,0.2),rgba(0,212,170,0.14));box-shadow:0 0 16px rgba(0,255,180,0.15)}
.prestige-btn:disabled{opacity:0.3;cursor:not-allowed}
.prestige-info{font-size:11px;color:var(--dim);text-align:center;margin-top:6px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--green);color:var(--text);padding:9px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:100;animation:toastAnim 2.5s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes toastAnim{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}

@media(max-width:640px){main{grid-template-columns:1fr;grid-template-rows:1fr 45vh}html,body{overflow:auto}.panel{border-left:none;border-top:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <a href="../../index.html" class="back">← IdleRush</a>
  <div class="logo">PRIMORDIAL <span>SOUP</span></div>
  <div class="era-badge" id="eraBadge">ERA 1</div>
</header>
<main>
  <div class="soup-area">
    <div class="era-title" id="eraTitle">🧬 Amino Acids</div>
    <div class="era-sub" id="eraSub">Click the soup to form proteins</div>
    <canvas id="soup" width="260" height="260"></canvas>
    <div class="resource-row">
      <div class="resource"><div class="resource-val" id="resMain">0</div><div class="resource-label" id="resMainLabel">Proteins</div></div>
      <div class="resource"><div class="resource-val" id="resRate">0/s</div><div class="resource-label">Auto Rate</div></div>
      <div class="resource"><div class="resource-val" id="resPrestige">0</div><div class="resource-label">Evolution Runs</div></div>
    </div>
    <div class="evolution-bar-wrap">
      <div class="evo-header"><span id="evoLabel">Next Evolution</span><span id="evoVal">0 / 500</span></div>
      <div class="evo-bar"><div class="evo-fill" id="evoFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-tabs">
      <button class="panel-tab active" data-tab="upgrades">Upgrades</button>
      <button class="panel-tab" data-tab="paths">Evo Path</button>
    </div>
    <div class="panel-content" id="panelContent"></div>
    <div class="prestige-wrap">
      <button class="prestige-btn" id="prestigeBtn" disabled>🧬 EVOLVE</button>
      <div class="prestige-info" id="prestigeInfo">Reach 500 proteins to evolve</div>
    </div>
  </div>
</main>

<script>
const SAVE='primordial_v1';
const ERAS=[
  {name:'Amino Acids',emoji:'🧬',sub:'Click the soup to form proteins',resource:'Proteins',threshold:500,bg:'#030a0a',particle:'·'},
  {name:'Single Cell',emoji:'🦠',sub:'Divide and multiply',resource:'Cells',threshold:5000,bg:'#030d08',particle:'○'},
  {name:'Multicellular',emoji:'🫧',sub:'Specialise your tissues',resource:'Tissue',threshold:50000,bg:'#040a12',particle:'◇'},
  {name:'Aquatic Life',emoji:'🐟',sub:'Evolve fins and gills',resource:'Biomass',threshold:500000,bg:'#030810',particle:'~'},
  {name:'Land Creatures',emoji:'🦎',sub:'Conquer the dry earth',resource:'Vitality',threshold:5000000,bg:'#080a03',particle:'✦'},
];
const UPGRADES=[
  {id:'click',name:'Click Potency',icon:'👆',desc:'Each click yields more',baseCost:20,baseVal:1,mult:1.4,max:20,effect:'click'},
  {id:'drift',name:'Thermal Drift',icon:'🌡️',desc:'Heat energy boosts idle',baseCost:50,baseVal:0.2,mult:1.45,max:15,effect:'auto'},
  {id:'catalyst',name:'Catalyst',icon:'⚗️',desc:'Reactions speed up globally',baseCost:200,baseVal:0.5,mult:1.5,max:10,effect:'auto'},
  {id:'membrane',name:'Membrane Fold',icon:'🫧',desc:'Stores more energy per tick',baseCost:800,baseVal:1.5,mult:1.55,max:8,effect:'auto'},
  {id:'rna',name:'RNA Strand',icon:'🧬',desc:'Codes for passive proteins',baseCost:3000,baseVal:4,mult:1.6,max:8,effect:'auto'},
  {id:'mitosis',name:'Mitosis',icon:'🔬',desc:'Cells divide autonomously',baseCost:12000,baseVal:12,mult:1.65,max:6,effect:'auto'},
  {id:'nucleus',name:'Nucleus',icon:'⚫',desc:'Centralises production',baseCost:50000,baseVal:35,mult:1.7,max:5,effect:'auto'},
];
const EVO_PATHS=[
  {id:'speed',name:'Rapid Evolver',emoji:'⚡',desc:'Mutations happen faster. Next era starts with 2× click power.',bonus:'×2 click on next run'},
  {id:'yield',name:'Resource Hoarder',emoji:'📦',desc:'You carry over 10% of resources through the prestige.',bonus:'+10% resource carryover'},
  {id:'unlock',name:'Genetic Memory',emoji:'🧠',desc:'One extra upgrade unlocked free at the start of next era.',bonus:'Free upgrade next run'},
];

let state={
  res:0,totalEver:0,era:0,prestige:0,
  upgrades:Object.fromEntries(UPGRADES.map(u=>[u.id,0])),
  chosenPath:null,
  pathHistory:[],
  mult:1,carryover:0,freeUpgrade:false,
};
let activeTab='upgrades';

function load(){try{const s=JSON.parse(localStorage.getItem(SAVE));if(s)state={...state,...s}}catch{}}
function save(){localStorage.setItem(SAVE,JSON.stringify(state))}

function getClickVal(){
  const base=UPGRADES.find(u=>u.id==='click');
  const lvl=state.upgrades['click']||0;
  const cv=1+lvl*(base.baseVal);
  return cv*state.mult*(state.chosenPath==='speed'?2:1);
}
function getAutoRate(){
  let rate=0;
  for(const u of UPGRADES.filter(u=>u.effect==='auto')){
    const lvl=state.upgrades[u.id]||0;
    if(lvl>0) rate+=lvl*u.baseVal*Math.pow(u.mult-1,lvl-1)*state.mult;
  }
  return rate;
}
function getUpgCost(u){return Math.floor(u.baseCost*Math.pow(u.mult,state.upgrades[u.id]||0))}

const canvas=document.getElementById('soup');
const ctx=canvas.getContext('2d');
let particles=[];
let bubbles=[];

function initBubbles(){
  bubbles=[];
  for(let i=0;i<18;i++) bubbles.push({
    x:30+Math.random()*200,y:30+Math.random()*200,
    r:2+Math.random()*5,vx:(Math.random()-.5)*.4,vy:-.2-Math.random()*.5,
    alpha:0.2+Math.random()*0.4,
  });
}
initBubbles();

function drawSoup(){
  const era=ERAS[Math.min(state.era,ERAS.length-1)];
  ctx.clearRect(0,0,260,260);
  // bg circle
  const grd=ctx.createRadialGradient(130,130,10,130,130,130);
  grd.addColorStop(0,'rgba(0,255,180,0.06)');
  grd.addColorStop(0.6,'rgba(0,80,60,0.12)');
  grd.addColorStop(1,'rgba(0,20,15,0.6)');
  ctx.beginPath();ctx.arc(130,130,128,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();

  // bubbles
  for(const b of bubbles){
    b.x+=b.vx;b.y+=b.vy;
    if(b.y<-10){b.y=260;b.x=30+Math.random()*200}
    if(b.x<10||b.x>250)b.vx*=-1;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(0,255,180,${b.alpha})`;ctx.lineWidth=1;ctx.stroke();
  }

  // floating DNA/cell shapes based on era
  const count=Math.min(30,5+state.era*6);
  ctx.font=`${12+state.era*2}px serif`;
  ctx.fillStyle='rgba(0,255,180,0.35)';
  ctx.textAlign='center';
  for(let i=0;i<count;i++){
    const angle=(i/count)*Math.PI*2+Date.now()*0.0003*(i%2?1:-1);
    const r=20+i*(80/count);
    const x=130+Math.cos(angle)*r;
    const y=130+Math.sin(angle)*r;
    ctx.globalAlpha=0.15+Math.abs(Math.sin(angle+i))*0.3;
    ctx.fillText(era.particle,x,y);
  }
  ctx.globalAlpha=1;

  // center emoji
  ctx.font='36px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillText(era.emoji,130,130);
  ctx.textBaseline='alphabetic';
}

let animFrame;
function loop(){drawSoup();animFrame=requestAnimationFrame(loop)}
loop();

canvas.addEventListener('click',e=>{
  const val=getClickVal();
  state.res+=val;state.totalEver+=val;
  const rect=canvas.getBoundingClientRect();
  spawnFloat(e.clientX-rect.left,e.clientY-rect.top,'+'+fmt(val));
  updateUI();
});

function spawnFloat(x,y,text){
  const span=document.createElement('span');
  span.className='float-particle';span.textContent=text;
  span.style.left=x+'px';span.style.top=y+'px';
  document.querySelector('.soup-area').appendChild(span);
  span.addEventListener('animationend',()=>span.remove());
}

function fmt(n){
  if(n>=1e9)return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return Math.floor(n).toLocaleString();
}

function updateUI(){
  const era=ERAS[Math.min(state.era,ERAS.length-1)];
  const threshold=era.threshold*(1+state.prestige*0.1);
  document.getElementById('eraTitle').textContent=era.emoji+' '+era.name;
  document.getElementById('eraSub').textContent=era.sub;
  document.getElementById('eraBadge').textContent='ERA '+(state.era+1);
  document.getElementById('resMainLabel').textContent=era.resource;
  document.getElementById('resMain').textContent=fmt(state.res);
  document.getElementById('resRate').textContent=fmt(getAutoRate())+'/s';
  document.getElementById('resPrestige').textContent=state.prestige;
  document.getElementById('evoLabel').textContent='Next Evolution';
  document.getElementById('evoVal').textContent=fmt(state.res)+' / '+fmt(threshold);
  document.getElementById('evoFill').style.width=Math.min(100,(state.res/threshold)*100)+'%';
  const canEvolve=state.res>=threshold&&state.era<ERAS.length-1;
  document.getElementById('prestigeBtn').disabled=!canEvolve;
  document.getElementById('prestigeInfo').textContent=canEvolve?'Choose your evolution path first!':'Need '+fmt(threshold)+' '+era.resource+' to evolve';
  if(activeTab==='upgrades')renderUpgrades();
  save();
}

function renderUpgrades(){
  const panel=document.getElementById('panelContent');
  panel.innerHTML='';
  for(const u of UPGRADES){
    const lvl=state.upgrades[u.id]||0;
    const cost=getUpgCost(u);
    const maxed=lvl>=u.max;
    const locked=!maxed&&state.res<cost;
    const freeFirst=state.freeUpgrade&&lvl===0;
    const div=document.createElement('div');
    div.className='upg-card'+(maxed?' maxed':locked&&!freeFirst?' locked':'');
    div.innerHTML=`<div class="upg-icon">${u.icon}</div><div class="upg-info"><div class="upg-name">${u.name}${lvl>0?`<span class="upg-lvl">Lv${lvl}</span>`:''}</div><div class="upg-desc">${u.desc}</div></div><div class="upg-cost">${maxed?'MAX':freeFirst?'FREE':'🧬 '+fmt(cost)}</div>`;
    if(!maxed&&(!locked||freeFirst))div.addEventListener('click',()=>buyUpgrade(u,freeFirst));
    panel.appendChild(div);
  }
}

function renderPaths(){
  const panel=document.getElementById('panelContent');
  panel.innerHTML='';
  for(const p of EVO_PATHS){
    const div=document.createElement('div');
    div.className='path-card'+(state.chosenPath===p.id?' selected':'');
    div.innerHTML=`<div class="path-name">${p.emoji} ${p.name}</div><div class="path-desc">${p.desc}</div><div class="path-bonus">✦ ${p.bonus}</div>`;
    div.addEventListener('click',()=>{state.chosenPath=p.id;renderPaths();save()});
    panel.appendChild(div);
  }
}

function buyUpgrade(u,free){
  const cost=getUpgCost(u);
  if(!free&&state.res<cost)return;
  if(!free)state.res-=cost;
  if(free)state.freeUpgrade=false;
  state.upgrades[u.id]=(state.upgrades[u.id]||0)+1;
  toast(u.icon+' '+u.name+' upgraded!');
  updateUI();
}

document.getElementById('prestigeBtn').addEventListener('click',()=>{
  if(!state.chosenPath){toast('⚠️ Choose an evolution path first!');return}
  state.era=Math.min(state.era+1,ERAS.length-1);
  state.prestige+=1;
  state.pathHistory.push(state.chosenPath);
  const carry=state.chosenPath==='yield'?state.res*0.1:state.carryover;
  state.freeUpgrade=state.chosenPath==='unlock';
  state.mult=1+state.pathHistory.filter(p=>p==='speed').length*0.5;
  state.res=carry+state.carryover;
  state.upgrades=Object.fromEntries(UPGRADES.map(u=>[u.id,0]));
  state.chosenPath=null;
  toast('🧬 Evolution! Era '+(state.era+1)+' begins!');
  updateUI();
  activeTab='upgrades';
  document.querySelectorAll('.panel-tab').forEach((t,i)=>{t.classList.toggle('active',i===0)});
  renderUpgrades();
});

document.querySelectorAll('.panel-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.panel-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');activeTab=t.dataset.tab;
    if(activeTab==='upgrades')renderUpgrades();else renderPaths();
  });
});

function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());
}

let last=performance.now();
function tick(now){
  const dt=(now-last)/1000;last=now;
  const rate=getAutoRate();
  if(rate>0){state.res+=rate*dt;state.totalEver+=rate*dt}
  document.getElementById('resMain').textContent=fmt(state.res);
  requestAnimationFrame(tick);
}

load();updateUI();renderUpgrades();requestAnimationFrame(tick);
setInterval(save,10000);
</script>
</body>
</html>
